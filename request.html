<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Request Movies - SD FILMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body { width:100%; min-height:100%; margin:0; padding:0; overflow-x: hidden; }
    :root {
      --primary: #8A2BE2;
      --secondary: #FF6B9D;
      --accent: #4ECDC4;
      --dark: #2C2C54;
      --light: #F7F7F7;
      --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    }
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--light); color: var(--dark); line-height: 1.6; }
    .header2 { background: linear-gradient(135deg, #8A2BE2, #FF6B9D); color: #fff; padding: 32px 0 10px; text-align: center;}
    .header-title { font-family: 'Montserrat', Arial, sans-serif; font-size: 54px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; background: linear-gradient(90deg, #fff 40%, #FFD700 70%, #ff97d2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
    .tagline2 { font-size: 20px; color: #fff; margin-bottom: 12px; }
    .container2 { width: 97%; max-width: 600px; margin: 28px auto 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 10px 32px rgba(44,44,84,0.09); padding: 22px 10px 18px 10px;}
    .form-title { font-size: 22px; font-weight: 700; margin-bottom: 18px; text-align:center;}
    form { display: flex; gap: 10px; align-items: center; margin-bottom: 25px;}
    input[type="text"] { flex: 1; padding: 13px 12px; border-radius: 8px; border: 1.5px solid #DDD; font-size: 17px; }
    button[type="submit"] { background: linear-gradient(135deg, #8A2BE2, #FF6B9D); color: #fff; border: none; border-radius: 8px; padding: 11px 18px; font-size: 17px; font-weight: 600; cursor: pointer; transition: background 0.2s;}
    button[type="submit"]:hover { background: #6c1bb0;}
    .comments-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .comments-list { list-style: none; padding: 0;}
    .comments-list li { background: #f3f0fa; margin-bottom: 8px; border-radius: 6px; padding: 10px 14px; font-size: 16px; }
    .no-comments { color: #999; font-style: italic; text-align:center; }
    .footer { background-color: var(--dark); color: white; padding: 30px 0 10px; margin-top: 40px;}
    .footer-content { text-align: center;}
    .copyright { text-align: center; padding-top: 15px; font-size: 14px; color: #aaa;}
    @media (max-width: 992px) { .header-title { font-size: 38px; } }
    @media (max-width: 768px) {
      .container2 { padding: 12px; min-width: 95vw; }
      .header-title { font-size: 28px; }
    }
    @media (max-width: 480px) {
      .header-title { font-size: 16px; letter-spacing:2px; }
      .container2 { padding: 7px; }
    }
  </style>
</head>
<body>
<div class="header2">
  <div class="header-title">SD FILMS</div>
  <div class="tagline2">Request a Movie</div>
  <nav>
    <ul style="justify-content:center; list-style:none; display:flex; gap:20px; padding:0; margin:16px 0 0 0;">
      <li><a href="index.html" style="color:#fff;">Home</a></li>
      <li><a href="movies.html" style="color:#fff;">Movies</a></li>
    </ul>
  </nav>
</div>
<div class="container2">
  <div class="form-title">Comment the Film Name you want added!</div>
  <form id="commentForm" autocomplete="off">
    <input type="text" id="filmInput" placeholder="Enter film name..." required maxlength="100" />
    <button type="submit">Comment</button>
  </form>
  <div class="comments-title">Requested Films:</div>
  <ul class="comments-list" id="commentsList"></ul>
  <div id="noComments" class="no-comments">No requests yet.</div>
</div>
<footer class="footer">
  <div class="footer-content">
    <p>SD FILMS. All rights reserved. | Designed for movie lovers</p>
  </div>
  <div class="copyright">
    <p>&copy; 2023 SD FILMS.</p>
  </div>
</footer>
<script>
document.addEventListener('DOMContentLoaded', function() {
  function getComments() {
    return JSON.parse(localStorage.getItem('filmRequests') || "[]");
  }
  
  function saveComments(comments) {
    localStorage.setItem('filmRequests', JSON.stringify(comments));
  }
  
  function renderComments() {
    const comments = getComments();
    const commentsList = document.getElementById('commentsList');
    const noComments = document.getElementById('noComments');
    commentsList.innerHTML = '';
    if (comments.length === 0) {
      noComments.style.display = 'block';
    } else {
      noComments.style.display = 'none';
      comments.forEach(c => {
        const li = document.createElement('li');
        li.textContent = c;
        commentsList.appendChild(li);
      });
    }
  }
  
  const commentForm = document.getElementById('commentForm');
  const filmInput = document.getElementById('filmInput');
  
  commentForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const val = filmInput.value.trim();
    if(val.length > 0) {
      const comments = getComments();
      comments.unshift(val);
      saveComments(comments);
      filmInput.value = '';
      renderComments();
    }
  });
  
  renderComments();
});
</script>
</body>
</html>
